<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz · Neurobiología de Sistemas Funcionales</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161920;
    --card: #1e2230;
    --border: #2a2f42;
    --accent: #6c8eff;
    --accent2: #a78bfa;
    --correct: #34d399;
    --wrong: #f87171;
    --text: #e8eaf2;
    --muted: #7c85a2;
    --warn: #fbbf24;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    color: var(--accent);
    letter-spacing: -0.02em;
    flex-shrink: 0;
  }
  .header-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
  .header-title { font-size: 0.8rem; color: var(--muted); font-weight: 400; line-height: 1.3; }

  /* ── STATS BAR ── */
  .stats-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .stat-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .stat-val {
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text);
  }
  .stat-val.green { color: var(--correct); }
  .stat-val.red   { color: var(--wrong); }
  .stat-val.blue  { color: var(--accent); }

  .progress-wrap {
    flex: 1;
    min-width: 120px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .progress-track {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .progress-label { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }

  /* ── MAIN ── */
  main {
    flex: 1;
    padding: 32px 16px;
    display: flex;
    justify-content: center;
  }

  .quiz-wrap {
    width: 100%;
    max-width: 740px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ── QUESTION CARD ── */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    animation: fadeUp 0.3s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .q-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .q-num {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(108,142,255,0.12);
    padding: 4px 10px;
    border-radius: 99px;
  }
  .q-badge {
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 99px;
    font-weight: 500;
  }
  .q-badge.review {
    background: rgba(251,191,36,0.15);
    color: var(--warn);
  }
  .q-badge.new {
    background: rgba(108,142,255,0.12);
    color: var(--accent);
  }

  .q-text {
    font-family: 'DM Serif Display', serif;
    font-size: 1.15rem;
    line-height: 1.55;
    color: var(--text);
    margin-bottom: 28px;
  }

  /* ── OPTIONS ── */
  .options { display: flex; flex-direction: column; gap: 10px; }

  .opt-btn {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 18px;
    background: rgba(255,255,255,0.03);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: var(--text);
    transition: all 0.18s ease;
    line-height: 1.45;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(108,142,255,0.07);
  }
  .opt-btn.selected {
    border-color: var(--accent);
    background: rgba(108,142,255,0.1);
  }
  .opt-btn.correct {
    border-color: var(--correct);
    background: rgba(52,211,153,0.1);
  }
  .opt-btn.wrong {
    border-color: var(--wrong);
    background: rgba(248,113,113,0.1);
  }
  .opt-btn:disabled { cursor: default; }

  .opt-letter {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--muted);
    transition: all 0.18s;
    margin-top: 1px;
  }
  .opt-btn.selected .opt-letter { background: var(--accent); color: #fff; }
  .opt-btn.correct .opt-letter  { background: var(--correct); color: #fff; }
  .opt-btn.wrong .opt-letter    { background: var(--wrong);   color: #fff; }

  /* ── FEEDBACK ── */
  .feedback {
    margin-top: 20px;
    padding: 16px 20px;
    border-radius: 10px;
    font-size: 0.875rem;
    line-height: 1.55;
    display: none;
  }
  .feedback.show { display: block; animation: fadeUp 0.25s ease; }
  .feedback.correct-fb {
    background: rgba(52,211,153,0.1);
    border: 1px solid rgba(52,211,153,0.3);
    color: #a7f3d0;
  }
  .feedback.wrong-fb {
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.3);
    color: #fecaca;
  }
  .fb-label {
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ── ACTION BUTTONS ── */
  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .btn {
    padding: 10px 22px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.18s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 2px 16px rgba(108,142,255,0.3);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(108,142,255,0.4); }
  .btn-primary:disabled { opacity: 0.35; cursor: default; transform: none; }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1.5px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

  .btn-warn {
    background: rgba(251,191,36,0.15);
    color: var(--warn);
    border: 1.5px solid rgba(251,191,36,0.3);
  }
  .btn-warn:hover { background: rgba(251,191,36,0.25); }

  .btn-danger {
    background: rgba(248,113,113,0.12);
    color: var(--wrong);
    border: 1.5px solid rgba(248,113,113,0.25);
  }
  .btn-danger:hover { background: rgba(248,113,113,0.2); }

  /* ── NAV CONTROLS ── */
  .nav-controls {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
  }

  /* ── FINAL DASHBOARD ── */
  #screen-final { display: none; }
  .dashboard {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px;
  }
  .dash-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .dash-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 32px; }

  .dash-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }
  .dash-stat {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 16px;
    text-align: center;
  }
  .dash-stat-val {
    font-size: 2rem;
    font-weight: 700;
    font-family: 'DM Serif Display', serif;
    line-height: 1;
    margin-bottom: 6px;
  }
  .dash-stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  .dash-section-title {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 12px;
    font-weight: 600;
  }

  .weak-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .weak-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: rgba(248,113,113,0.07);
    border: 1px solid rgba(248,113,113,0.18);
    border-radius: 8px;
    font-size: 0.83rem;
    color: #fecaca;
  }

  .rec-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; }
  .rec-item {
    display: flex;
    gap: 10px;
    padding: 10px 14px;
    background: rgba(108,142,255,0.07);
    border: 1px solid rgba(108,142,255,0.18);
    border-radius: 8px;
    font-size: 0.83rem;
    color: #c7d2fe;
    line-height: 1.45;
  }

  .grade-ring {
    width: 90px;
    height: 90px;
    margin: 0 auto 24px;
    position: relative;
  }
  .grade-ring svg { transform: rotate(-90deg); }
  .grade-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Serif Display', serif;
    font-size: 1.4rem;
    color: var(--text);
  }

  /* ── EMPTY / STATES ── */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--muted);
  }
  .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
  .empty-state p { font-size: 0.9rem; line-height: 1.6; }

  /* ── RESPONSIVE ── */
  @media (max-width: 540px) {
    header { padding: 12px 16px; }
    .stats-bar { gap: 12px; padding: 10px 16px; }
    .q-card { padding: 20px 16px; }
    .q-text { font-size: 1rem; }
    main { padding: 16px 10px; }
    .dashboard { padding: 24px 16px; }
    .btn { padding: 9px 16px; font-size: 0.82rem; }
  }
</style>
</head>
<body>

<header>
  <span class="logo">Neurobio Quiz</span>
  <div class="header-divider"></div>
  <span class="header-title">Máster · Neurociencia Cognitiva y Neuropsicología</span>
</header>

<div class="stats-bar">
  <div class="stat-pill">
    Respondidas: <span class="stat-val blue" id="s-answered">0</span>/<span id="s-total">0</span>
  </div>
  <div class="stat-pill">
    ✅ <span class="stat-val green" id="s-correct">0</span>
  </div>
  <div class="stat-pill">
    ❌ <span class="stat-val red" id="s-wrong">0</span>
  </div>
  <div class="stat-pill">
    Precisión: <span class="stat-val blue" id="s-pct">—</span>
  </div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <span class="progress-label" id="progress-label">0%</span>
  </div>
</div>

<!-- QUIZ SCREEN -->
<main id="screen-quiz">
  <div class="quiz-wrap">

    <div class="q-card" id="q-card">
      <div class="q-meta">
        <span class="q-num" id="q-num">P. 1</span>
        <span class="q-badge" id="q-badge"></span>
      </div>
      <div class="q-text" id="q-text">Cargando…</div>
      <div class="options" id="options-list"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btn-answer" onclick="submitAnswer()">Responder</button>
      <button class="btn btn-primary" id="btn-next"   onclick="nextQuestion()" style="display:none">Siguiente →</button>
    </div>

    <div class="nav-controls">
      <button class="btn btn-ghost"   onclick="shuffleQueue()">🔀 Mezclar</button>
      <button class="btn btn-warn"    onclick="reviewErrors()">⚠️ Revisar errores</button>
      <button class="btn btn-danger"  onclick="restartQuiz()">↺ Reiniciar</button>
      <button class="btn btn-ghost"   onclick="showFinal()">📊 Ver resultado</button>
    </div>

  </div>
</main>

<!-- FINAL SCREEN -->
<main id="screen-final" style="display:none">
  <div class="quiz-wrap">
    <div class="dashboard">
      <div class="dash-title" id="f-title">Resultado final</div>
      <div class="dash-sub">Sesión completada · Neurobiología de Sistemas Funcionales</div>

      <div class="grade-ring">
        <svg width="90" height="90" viewBox="0 0 90 90">
          <circle cx="45" cy="45" r="38" fill="none" stroke="#2a2f42" stroke-width="7"/>
          <circle id="f-ring" cx="45" cy="45" r="38" fill="none" stroke="url(#grad)" stroke-width="7"
                  stroke-linecap="round" stroke-dasharray="238.76" stroke-dashoffset="238.76"/>
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#6c8eff"/>
              <stop offset="100%" stop-color="#a78bfa"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="grade-text" id="f-pct-ring">0%</div>
      </div>

      <div class="dash-grid">
        <div class="dash-stat">
          <div class="dash-stat-val blue" id="f-total">0</div>
          <div class="dash-stat-label">Total preguntas</div>
        </div>
        <div class="dash-stat">
          <div class="dash-stat-val green" id="f-correct">0</div>
          <div class="dash-stat-label">Correctas</div>
        </div>
        <div class="dash-stat">
          <div class="dash-stat-val red" id="f-wrong">0</div>
          <div class="dash-stat-label">Incorrectas</div>
        </div>
        <div class="dash-stat">
          <div class="dash-stat-val" id="f-pct" style="color:var(--accent)">—</div>
          <div class="dash-stat-label">Precisión</div>
        </div>
      </div>

      <div class="dash-section-title">Temas más débiles</div>
      <div class="weak-list" id="f-weak"></div>

      <div class="dash-section-title">Recomendaciones de estudio</div>
      <div class="rec-list" id="f-recs"></div>

      <div class="actions">
        <button class="btn btn-danger" onclick="restartQuiz()">↺ Reiniciar desde cero</button>
        <button class="btn btn-warn"   onclick="reviewErrors()">⚠️ Solo errores</button>
        <button class="btn btn-primary" onclick="backToQuiz()">← Volver al quiz</button>
      </div>
    </div>
  </div>
</main>

<script>
// ─────────────────────────────────────────────
// BANCO DE PREGUNTAS (extraídas del documento)
// Excluidas: preguntas que dependen de figuras
// sin texto descriptivo (P1 original, P6 original)
// y las posiciones 2,3,5,7,9 según instrucción
// ─────────────────────────────────────────────
const BANK = [
  {
    id: 1,
    tema: "Potenciales de acción",
    pregunta: "Marca la respuesta correcta respecto a los potenciales de acción:",
    opts: {
      A: "Codifican la información en el dominio de la frecuencia.",
      B: "Facilitar la liberación de un neurotransmisor.",
      C: "Se pueden generar en las dendritas.",
      D: "Todas son correctas."
    },
    correcta: "D",
    explicacion: "Todas las afirmaciones son correctas: los PA codifican información en frecuencia (código de frecuencia), facilitan la liberación de neurotransmisor al llegar al terminal presináptico, y aunque es menos común, en algunas neuronas sí pueden generarse PA dendríticos."
  },
  {
    id: 2,
    tema: "Neurotransmisores y sinapsis",
    pregunta: "¿Cuál es el papel de los astrocitos en la transmisión de información neural?",
    opts: {
      A: "Controlar la concentración del neurotransmisor liberado por la neurona presináptica.",
      B: "Liberar algunos gliotransmisores, como el glutamato.",
      C: "Responder a algunos neurotransmisores.",
      D: "Todas son correctas."
    },
    correcta: "D",
    explicacion: "Los astrocitos participan activamente en la transmisión sináptica: regulan la concentración extracelular de neurotransmisores (recaptación), pueden liberar gliotransmisores (glutamato, ATP, D-serina) y expresan receptores para neurotransmisores, por lo que 'todas son correctas'."
  },
  {
    id: 3,
    tema: "Neurotransmisores y sinapsis",
    pregunta: "En base a los experimentos de Bernard Katz y Ricardo Miledi sobre la liberación de los neurotransmisores en la sinapsis química se puede concluir que la liberación de un neurotransmisor puede ser:",
    opts: {
      A: "Sincrónica.",
      B: "Asincrónica.",
      C: "Espontánea.",
      D: "Todas son correctas."
    },
    correcta: "D",
    explicacion: "Katz y Miledi demostraron que la liberación cuántica de neurotransmisores ocurre de forma sincrónica (dependiente del PA), asincrónica (retardada tras el PA) y espontánea (mEPPs en reposo), por lo que todas las opciones son correctas."
  },
  {
    id: 4,
    tema: "Neurotransmisores y sinapsis",
    pregunta: "Marca la pareja incorrecta entre el neurotransmisor y el mecanismo fisiológico existente para eliminar su efecto en la sinapsis.",
    opts: {
      A: "Orexinas — peptidasas.",
      B: "Catecolaminas — transportador de membrana plasmática.",
      C: "Serotonina — lipasas.",
      D: "Acetilcolina — acetilcolinesterasa."
    },
    correcta: "C",
    explicacion: "La serotonina (5-HT) se elimina de la sinapsis principalmente mediante recaptación por el transportador SERT, NO por lipasas. Las lipasas no son el mecanismo de inactivación de la serotonina. Las demás parejas son correctas."
  },
  {
    id: 5,
    tema: "Endocannabinoides y sinapsis",
    pregunta: "En algunas sinapsis glutamatérgicas, se sintetizan endocannabinoides como el 2-araquidonilglicerol. Este compuesto actuará ___ sobre receptores CB1 para ___ la liberación de glutamato.",
    opts: {
      A: "Presinápticamente / estimular.",
      B: "Postsinápticamente / estimular.",
      C: "Postsinápticamente / inhibir.",
      D: "Presinápticamente / inhibir."
    },
    correcta: "D",
    explicacion: "Los endocannabinoides como el 2-AG se sintetizan en la neurona postsináptica y actúan de forma retrógrada sobre receptores CB1 ubicados en el terminal presináptico, inhibiendo la liberación de glutamato (DSE: depresión sináptica inducida por despolarización)."
  },
  {
    id: 6,
    tema: "Barrera hematoencefálica",
    pregunta: "En algunos desórdenes del desarrollo del sistema nervioso se encuentra una barrera hematoencefálica más permeable que en el resto de la población. En estos pacientes, ¿la ingesta proteica afectará a la función nerviosa?",
    opts: {
      A: "No.",
      B: "Sí, porque algunos neurotransmisores, como las endorfinas están presentes en la mayoría de los alimentos.",
      C: "Sí, porque el ácido glutámico, que se encuentra en la mayoría de las proteínas, podría excitar a las neuronas.",
      D: "Todas son incorrectas."
    },
    correcta: "C",
    explicacion: "Normalmente la BHE impide que el glutamato dietético entre al SNC. Si la BHE está alterada, el ácido glutámico (glutamato) procedente de las proteínas de la dieta podría atravesarla y excitar neuronas a través de receptores AMPA/NMDA, alterando la función neural."
  },
  {
    id: 7,
    tema: "Farmacología de neurotransmisores",
    pregunta: "Nacho Vidal administró 5-hidroxi-N,N-dimetriltriptamina, un derivado de la dimetiltriptamina (DMT). ¿Cuál es la diana farmacológica de la DMT en el sistema nervioso central?",
    opts: {
      A: "Receptores nicotínicos.",
      B: "Receptores de serotonina (5HT2A).",
      C: "Transportador de dopamina.",
      D: "MAO."
    },
    correcta: "B",
    explicacion: "La DMT y sus derivados son agonistas potentes de los receptores serotoninérgicos 5-HT2A en el córtex prefrontal, lo que produce sus efectos psicodélicos y alucinógenos. Esta es su principal diana farmacológica en el SNC."
  },
  {
    id: 8,
    tema: "Farmacología de neurotransmisores",
    pregunta: "Los inhibidores de la MAO fueron los primeros antidepresivos sintetizados, sin embargo, se han dejado de utilizar con tal fin porque...",
    opts: {
      A: "Disminuyen los niveles de serotonina.",

};

function initState() {
  state.scores = {};
  BANK.forEach(q => { state.scores[q.id] = { correct: 0, incorrect: 0 }; });
  state.totalAnswered = 0;
  state.totalCorrect = 0;
  state.totalWrong = 0;
  state.mode = 'normal';
  buildQueue();
}

// Repetición espaciada simple:
// incorrectas → peso 3, no respondidas → peso 2, correctas → peso 1
function buildQueue() {
  let pool = [];
  BANK.forEach(q => {
    const s = state.scores[q.id];
    let weight = 2;
    if (s.incorrect > s.correct) weight = 3;
    else if (s.correct > 0 && s.incorrect === 0) weight = 1;
    for (let i = 0; i < weight; i++) pool.push(q.id);
  });
  shuffleArr(pool);
  state.queue = pool;
  state.qIndex = 0;
}

function shuffleArr(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function currentQ() {
  if (state.qIndex >= state.queue.length) return null;
  const id = state.queue[state.qIndex];
  return BANK.find(q => q.id === id);
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function renderQuestion() {
  const q = currentQ();
  if (!q) { showFinal(); return; }

  state.answered = false;
  state.selectedOpt = null;

  document.getElementById('q-num').textContent = `P. ${state.qIndex + 1}`;

  const badge = document.getElementById('q-badge');
  const s = state.scores[q.id];
  if (s.incorrect > 0) {
    badge.textContent = '⚠️ A repasar';
    badge.className = 'q-badge review';
  } else if (s.correct > 0) {
    badge.textContent = '✅ Ya vista';
    badge.className = 'q-badge new';
    badge.style.background = 'rgba(52,211,153,0.12)';
    badge.style.color = 'var(--correct)';
  } else {
    badge.textContent = '🆕 Nueva';
    badge.className = 'q-badge new';
    badge.style.background = '';
    badge.style.color = '';
  }

  document.getElementById('q-text').textContent = q.pregunta;

  const optsList = document.getElementById('options-list');
  optsList.innerHTML = '';
  ['A','B','C','D'].forEach(letter => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.onclick = () => selectOpt(letter, btn);
    btn.innerHTML = `<span class="opt-letter">${letter}</span><span>${q.opts[letter]}</span>`;
    optsList.appendChild(btn);
  });

  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.innerHTML = '';

  document.getElementById('btn-answer').style.display = '';
  document.getElementById('btn-answer').disabled = true;
  document.getElementById('btn-next').style.display = 'none';

  updateStats();

  // Reactivar card animation
  const card = document.getElementById('q-card');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = '';
}

function selectOpt(letter, btn) {
  if (state.answered) return;
  state.selectedOpt = letter;
  document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('btn-answer').disabled = false;
}

function submitAnswer() {
  if (!state.selectedOpt || state.answered) return;
  state.answered = true;

  const q = currentQ();
  const correct = state.selectedOpt === q.correcta;

  // Actualizar scores
  state.scores[q.id][correct ? 'correct' : 'incorrect']++;
  state.totalAnswered++;
  if (correct) state.totalCorrect++;
  else state.totalWrong++;

  // Pintar opciones
  document.querySelectorAll('.opt-btn').forEach((btn, i) => {
    const letter = ['A','B','C','D'][i];
    btn.disabled = true;
    if (letter === q.correcta) btn.classList.add('correct');
    else if (letter === state.selectedOpt && !correct) btn.classList.add('wrong');
    btn.classList.remove('selected');
  });

  // Feedback
  const fb = document.getElementById('feedback');
  fb.className = `feedback show ${correct ? 'correct-fb' : 'wrong-fb'}`;
  fb.innerHTML = `
    <div class="fb-label">${correct ? '✅ ¡Correcto!' : '❌ Incorrecto'}</div>
    ${!correct ? `<strong>La respuesta correcta era: ${q.correcta} — ${q.opts[q.correcta]}</strong><br><br>` : ''}
    ${q.explicacion}
  `;

  document.getElementById('btn-answer').style.display = 'none';
  document.getElementById('btn-next').style.display = '';
  updateStats();
}

function nextQuestion() {
  state.qIndex++;

  // Si llegamos al final de la queue, reconstruirla priorizando errores
  if (state.qIndex >= state.queue.length) {
    buildQueue();
    return;
  }
  renderQuestion();
}

// ─────────────────────────────────────────────
// CONTROLES
// ─────────────────────────────────────────────
function shuffleQueue() {
  buildQueue();
  renderQuestion();
}

function reviewErrors() {
  const errIds = BANK
    .filter(q => state.scores[q.id].incorrect > state.scores[q.id].correct)
    .map(q => q.id);

  if (errIds.length === 0) {
    alert('¡No hay preguntas con errores registrados todavía! Responde algunas preguntas primero.');
    return;
  }
  state.queue = shuffleArr([...errIds, ...errIds, ...errIds]);
  state.qIndex = 0;
  state.mode = 'review';
  backToQuiz();
  renderQuestion();
}

function restartQuiz() {
  if (!confirm('¿Reiniciar el quiz? Se perderá el progreso de esta sesión.')) return;
  initState();
  backToQuiz();
  renderQuestion();
}

function showFinal() {
  document.getElementById('screen-quiz').style.display = 'none';
  document.getElementById('screen-final').style.display = 'flex';

  const pct = state.totalAnswered > 0
    ? Math.round((state.totalCorrect / state.totalAnswered) * 100)
    : 0;

  document.getElementById('f-title').textContent =
    pct >= 80 ? '🎉 ¡Excelente resultado!' :
    pct >= 60 ? '📚 Buen progreso' : '💪 Sigue practicando';

  document.getElementById('f-total').textContent   = state.totalAnswered;
  document.getElementById('f-correct').textContent = state.totalCorrect;
  document.getElementById('f-wrong').textContent   = state.totalWrong;
  document.getElementById('f-pct').textContent     = pct + '%';
  document.getElementById('f-pct-ring').textContent = pct + '%';

  // Anillo de progreso
  const circumference = 238.76;
  const offset = circumference - (pct / 100) * circumference;
  document.getElementById('f-ring').style.strokeDashoffset = offset;

  // Temas débiles
  const weakEl = document.getElementById('f-weak');
  const weakTopics = getWeakTopics();
  if (weakTopics.length === 0) {
    weakEl.innerHTML = '<div class="rec-item">🎯 ¡Sin temas débiles detectados todavía! Responde más preguntas.</div>';
  } else {
    weakEl.innerHTML = weakTopics.slice(0, 5).map(t =>
      `<div class="weak-item">⚠️ ${t.tema} — ${t.incorrectas} error(es)</div>`
    ).join('');
  }

  // Recomendaciones
  const recs = genRecommendations(pct, weakTopics);
  document.getElementById('f-recs').innerHTML = recs.map(r =>
    `<div class="rec-item">💡 ${r}</div>`
  ).join('');
}

function backToQuiz() {
  document.getElementById('screen-final').style.display = 'none';
  document.getElementById('screen-quiz').style.display = 'flex';
}

// ─────────────────────────────────────────────
// STATS
// ─────────────────────────────────────────────
function updateStats() {
  const pct = state.totalAnswered > 0
    ? Math.round((state.totalCorrect / state.totalAnswered) * 100) + '%'
    : '—';
  document.getElementById('s-answered').textContent = state.totalAnswered;
  document.getElementById('s-total').textContent    = BANK.length;
  document.getElementById('s-correct').textContent  = state.totalCorrect;
  document.getElementById('s-wrong').textContent    = state.totalWrong;
  document.getElementById('s-pct').textContent      = pct;

  const fillPct = state.totalAnswered > 0
    ? (state.totalAnswered / (BANK.length * 2)) * 100
    : 0;
  document.getElementById('progress-fill').style.width = Math.min(fillPct, 100) + '%';
  document.getElementById('progress-label').textContent =
    state.totalAnswered + '/' + BANK.length + ' únicas';
}

function getWeakTopics() {
  const map = {};
  BANK.forEach(q => {
    const s = state.scores[q.id];
    if (!map[q.tema]) map[q.tema] = { correctas: 0, incorrectas: 0 };
    map[q.tema].correctas  += s.correct;
    map[q.tema].incorrectas += s.incorrect;
  });
  return Object.entries(map)
    .filter(([, v]) => v.incorrectas > 0)
    .sort(([,a],[,b]) => b.incorrectas - a.incorrectas)
    .map(([tema, v]) => ({ tema, ...v }));
}

function genRecommendations(pct, weakTopics) {
  const recs = [];
  if (pct < 50) recs.push('Tu precisión es baja: revisa los conceptos básicos antes de continuar el quiz.');
  if (pct >= 80) recs.push('¡Excelente! Mantén el ritmo y usa la función "Revisar errores" para los pocos fallos.');
  if (weakTopics.length > 0) {
    recs.push(`Prioriza el repaso de: ${weakTopics.slice(0,3).map(t=>t.tema).join(', ')}.`);
  }
  recs.push('Usa el botón "Revisar errores" para practicar solo las preguntas falladas con repetición intensiva.');
  recs.push('La repetición espaciada asigna más peso automáticamente a las preguntas incorrectas.');
  if (weakTopics.some(t => t.tema.includes('sináptica') || t.tema.includes('sinapsis'))) {
    recs.push('Repasa el mecanismo de LTP/LTD: son temas frecuentes en examen. Presta atención a Ca²⁺ y frecuencia.');
  }
  if (weakTopics.some(t => t.tema.includes('autónomo'))) {
    recs.push('Para el SNA: recuerda la regla "simpático=adrenérgico postganglionar, todo preganglionar=colinérgico".');
  }
  if (weakTopics.some(t => t.tema.includes('corteza') || t.tema.includes('Neuroanatomía'))) {
    recs.push('Dibuja el cerebro de memoria con los lóbulos, cisuras y áreas de Broca/Wernicke para fijar neuroanatomía.');
  }
  return recs.slice(0, 5);
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
initState();
renderQuestion();
</script>
